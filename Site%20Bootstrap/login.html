<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Armazém</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styleII.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Bem-vindo</h1>
            <p>Faça login para acessar o sistema</p>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingInput" placeholder="nome@email.com">
                <label for="floatingInput">E-mail</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Senha">
                <label for="floatingPassword">Senha</label>
            </div>

            <a href="pgI.html" class="btn btn-login">
                Entrar
            </a>

            <p class="mt-3">
                <a href="forgot.html" class="link-senha" style="color: white;">
                    Esqueceu sua senha?
                </a>
            </p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
