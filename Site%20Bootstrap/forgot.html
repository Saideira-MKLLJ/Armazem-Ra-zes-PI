<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Armazém</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styleII.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Recuperar Senha</h1>
            <p>Um código será enviado para seu email</p>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingEmail" placeholder="nome@email.com">
                <label for="floatingEmail">E-mail</label>
            </div>

            <div class="form-floating mb-3">
                <input type="tel" class="form-control" id="floatingTelefone" placeholder="(34) 99999-9999">
                <label for="floatingTelefone">Telefone</label>
            </div>

            <div id="codigoDiv" class="form-floating mb-3" style="display: none;">
                <input type="text" class="form-control" id="floatingCodigo" placeholder="Código">
                <label for="floatingCodigo">Digite o código</label>
            </div>

            <button type="button" class="btn btn-login" onclick="mostrarCodigo()">
                Enviar
            </button>

            <p class="mt-3">
    <a href="login.html" class="link-senha" style="color: white;">
        Voltar para o login
    </a>
</p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function mostrarCodigo() {
            document.getElementById("codigoDiv").style.display = "block";
        }
    </script>

</body>

</html>
