<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styleIV.css">

    <style>
        body {
            background: #f5f7fa;
        }

        .titulo {
            margin-top: 40px;
            text-align: center;
        }

        .titulo h1 {
            font-weight: bold;
            color: #198754;
        }

        .card-config {
            border: none;
            border-radius: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .card-config:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .icone {
            font-size: 50px;
            color: #198754;
        }
    </style>
</head>
<body>

<nav class="navbar-custom">
    <div class="nav-container">
        <a href="pgI.html" class="nav-link-custom">
            <i class="bi bi-house-fill"></i>
            <span>Home</span>
        </a>
        <a href="location.html" class="nav-link-custom">
            <i class="bi bi-geo-alt-fill"></i>
            <span>Local</span>
        </a>
        <a href="settings.html" class="nav-link-custom">
            <i class="bi bi-gear-fill"></i>
            <span>Config</span>
        </a>
        <a href="profile.html" class="nav-link-custom">
            <i class="bi bi-person-circle"></i>
            <span>Perfil</span>
        </a>
    </div>
</nav>

<div class="container mb-5">
    
    <div class="titulo">
        <h1><i class="bi bi-gear-fill"></i> Configurações</h1>
        <p class="text-muted">Gerencie as opções do sistema</p>
    </div>

    <div class="row mt-4 g-4">
        
        <div class="col-md-4">
            <div class="card card-config p-4 text-center">
                <div class="icone"><i class="bi bi-person-fill"></i></div>
                <h4 class="mt-3">Perfil</h4>
                <p class="text-muted">Altere seus dados pessoais.</p>
                <button class="btn btn-success w-100">Editar</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card card-config p-4 text-center">
                <div class="icone"><i class="bi bi-bell-fill"></i></div>
                <h4 class="mt-3">Notificações</h4>
                <p class="text-muted">Controle os avisos do sistema.</p>
                <button class="btn btn-success w-100">Configurar</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card card-config p-4 text-center">
                <div class="icone"><i class="bi bi-shield-lock-fill"></i></div>
                <h4 class="mt-3">Segurança</h4>
                <p class="text-muted">Altere senha e permissões.</p>
                <button class="btn btn-success w-100">Gerenciar</button>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card card-config p-4 text-center">
                <div class="icone"><i class="bi bi-moon-stars-fill"></i></div>
                <h4 class="mt-3">Aparência</h4>
                <p class="text-muted">Personalize o visual do sistema.</p>
                <button class="btn btn-outline-success w-100">Alterar</button>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card card-config p-4 text-center">
                <div class="icone"><i class="bi bi-database-fill"></i></div>
                <h4 class="mt-3">Banco de Dados</h4>
                <p class="text-muted">Backup e restauração das informações.</p>
                <button class="btn btn-outline-success w-100">Acessar</button>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const currentPage = window.location.pathname;
    
    document.querySelectorAll('.nav-link-custom').forEach(link => {
        link.classList.remove('active');
        // Se a URL atual terminar com o href do link, adiciona a classe active
        if (currentPage.endsWith(link.getAttribute('href'))) {
            link.classList.add('active');
        }
    });
</script>

</body>
</html>
