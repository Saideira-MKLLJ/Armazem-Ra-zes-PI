<head>

    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styleV.css">
</head>

<body>

  <nav class="navbar-custom">

    <div class="nav-container">

        <a href="pgI.html" class="nav-link-custom" data-name="Home">
            <i class="bi bi-house-fill"></i>
            <span>Home</span>
        </a>

        <a href="armazem.html" class="nav-link-custom" data-name="Armazem">
            <i class="bi bi-box-seam-fill"></i>
            <span>Armazem</span>
        </a>

    </div>

</nav>
  <footer>
    <div>
    </div>
  </footer>

  <div class="hstack gap-3 produto">
  <input class="form-control me-auto" type="text" placeholder="Adicione seu produto..." aria-label="Adicione seu produto...">
  <button type="button" class="btn btn-secondary" onclick="mostrarQuantidade(); mostrarPreco(); mostrarCategoria();">Submit</button>
  <div class="vr"></div>
  <button type="button" class="btn btn-outline-danger">Reset</button>
</div>
<div id="quantidadeDiv" style="display: none; margin-top:20px;">

    <input 
        type="number"
        id="quantidade"
        class="form-control"
        placeholder="Digite a quantidade"
    >
</div>
<div id="precoDiv" style="display: none; margin-top:20px;">

    <input 
        type="number"
        id="preco"
        class="form-control"
        placeholder="Digite o preço"
        step="0.01"
        min="0"
    >
</div>
<div id="categoriaDiv" style="display: none; margin-top:20px;">

    <input 
        type="text"
        id="categoria"
        class="form-control campo"
        placeholder="Digite a categoria"
    >
</div>
<script>
function mostrarQuantidade() {
    document.getElementById("quantidadeDiv").style.display = "block";
}

function mostrarPreco() {
    document.getElementById("precoDiv").style.display = "block";
}
function mostrarCategoria() {
    document.getElementById("categoriaDiv").style.display = "block";
}
</script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script>
  const links = document.querySelectorAll('.nav-link-custom');
  const currentPage = window.location.pathname.split('/').pop();

  links.forEach(link => {
    link.classList.remove('active');
    const linkPage = link.getAttribute('href').split('/').pop();
    if (linkPage === currentPage) {
      link.classList.add('active');
    }
  });
</script>
</body>

</html>
