<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Armazém</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styleV.css">

    <style>
        
    </style>
</head>

<body>

    <nav class="navbar-custom">

        <div class="nav-container">

            <a href="pgI.html" class="nav-link-custom" data-name="Home">
                <i class="bi bi-house-fill"></i>
                <span>Home</span>
            </a>

            <a href="armazem.html" class="nav-link-custom" data-name="Armazem">
                <i class="bi bi-box-seam-fill"></i>
                <span>Armazém</span>
            </a>

            <a href="produtos.html" class="nav-link-custom" data-name="Produtos">
                <i class="bi bi-basket2-fill"></i>
                <span>Produtos</span>
            </a>

        </div>

    </nav>

    <div class="container">

        <div class="page-title">
            <h1>
                <i class="bi bi-box-seam-fill"></i>
                Cadastro de Produtos
            </h1>
            <p class="text-muted">
                Adicione produtos ao estoque do armazém
            </p>
        </div>

        <div class="card shadow-lg card-produto">

            <div class="card-header">
                <h3 class="mb-0">
                    <i class="bi bi-plus-circle-fill"></i>
                    Novo Produto
                </h3>
            </div>

            <div class="card-body">

                <div class="mb-4">
                    <label class="form-label fw-bold">
                        Nome do Produto
                    </label>

                    <input
                        type="text"
                        id="produto"
                        class="form-control form-control-lg"
                        placeholder="Digite o nome do produto">
                </div>

                <div class="d-flex gap-2">

                    <button
                        type="button"
                        class="btn btn-success btn-lg"
                        onclick="mostrarCampos()">

                        <i class="bi bi-arrow-right-circle-fill"></i>
                        Continuar

                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-danger btn-lg"
                        onclick="limparCampos()">

                        <i class="bi bi-arrow-counterclockwise"></i>
                        Limpar

                    </button>

                </div>

                <div id="camposExtras">

                    <hr class="my-4">

                    <div class="row g-3">

                        <div class="col-md-4">

                            <label class="form-label fw-bold">
                                Quantidade
                            </label>

                            <input
                                type="number"
                                id="quantidade"
                                class="form-control"
                                placeholder="Digite a quantidade">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label fw-bold">
                                Preço
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    R$
                                </span>

                                <input
                                    type="number"
                                    id="preco"
                                    class="form-control"
                                    placeholder="0,00"
                                    step="0.01"
                                    min="0">

                            </div>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label fw-bold">
                                Categoria
                            </label>

                            <input
                                type="text"
                                id="categoria"
                                class="form-control"
                                placeholder="Digite a categoria">

                        </div>

                    </div>

                    <div class="text-end mt-4">

                        <button class="btn btn-success btn-lg">

                            <i class="bi bi-check-circle-fill"></i>
                            Salvar Produto

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <footer>
        <div></div>
    </footer>

    <script>
        function mostrarCampos() {
            document.getElementById("camposExtras").style.display = "block";
        }
    </script>

    <script>
        function mostrarCampos() {
            document.getElementById("camposExtras").style.display = "block";
        }

        function limparCampos() {

            document.getElementById("produto").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("preco").value = "";
            document.getElementById("categoria").value = "";

            document.getElementById("camposExtras").style.display = "none";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const links = document.querySelectorAll('.nav-link-custom');
        const currentPage = window.location.pathname.split('/').pop();
        const links = document.querySelectorAll('.nav-link-custom');
        const currentPage = window.location.pathname.split('/').pop();

        links.forEach(link => {
            link.classList.remove('active');
            const linkPage = link.getAttribute('href').split('/').pop();

            if (linkPage === currentPage) {
                link.classList.add('active');
            }
        });
    </script>

</body>

</html>
